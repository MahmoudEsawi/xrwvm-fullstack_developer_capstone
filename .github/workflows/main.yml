name: Lint Code Base

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python Linting Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint Python Code with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 server/djangoapp --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 server/djangoapp --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Frontend Dependencies & Build
      run: |
        cd server/frontend
        npm install
        npm run build
